workflows:
  ios-unsigned:
    name: iOS unsigned build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show build tools
        script: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Enable Swift Package Manager and resolve packages
        script: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Analyze Dart code
        script: flutter analyze --no-pub
      - name: Run Flutter tests
        script: flutter test --no-pub
      - name: Build unsigned iOS app and collect artifact
        script: bash scripts/build_ios_unsigned.sh
    artifacts:
      - build/ios/unsigned/*.zip
      - build/ios/unsigned/README.txt
      - /tmp/xcodebuild_logs/*.log
