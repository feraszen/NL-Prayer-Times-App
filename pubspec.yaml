name: my_ios_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Location Services
  geolocator: ^14.1.2
  geocoding: ^4.0.0

  # Prayer Times Calculation
  adhan: ^2.0.0

  # Date Formatting
  intl: ^0.20.3

  # Hijri Calendar
  hijri: ^3.0.0

  # Local Settings Storage
  shared_preferences: ^2.5.3

  # File Picker
  file_picker: ^13.3.2
  path: ^1.9.0

  # Audio Playback
  audioplayers: ^6.5.1

  # Notifications
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  