name: nl_prayer_times_app
description: "NL Prayer Times App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Location Services
  geolocator: ^14.1.2
  geocoding: ^4.0.0

  # Prayer Times
  adhan: ^2.0.0

  # Date & Time
  intl: ^0.20.3

  # Hijri Calendar
  hijri: ^3.0.0

  # Settings Storage
  shared_preferences: ^2.5.3

  # File Picker
  file_picker: ^13.3.2
  path: ^1.9.0

  # Audio Playback
  audioplayers: ^6.5.1

  # Notifications
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # Qibla Live Compass
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/mosque_app_icon_1024.png"
  min_sdk_android: 21
  